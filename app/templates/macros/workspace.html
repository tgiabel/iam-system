{% macro workspace_item(item) %}
<article class="ws-item" data-workspace-id="{{ item.id }}" data-kind="{{ item.kind }}">
    <span class="ws-item-icon"><img src="/static/img/{{ item.icon }}" alt=""></span>
    <h3 class="ws-item-title"><a href="{{ item.href }}" class="ws-item-link" title="{{ item.copy }}">{{ item.title }}</a></h3>
    <div class="ws-item-actions">
        <button type="button" class="ws-item-button ws-item-pin" aria-pressed="false" aria-label="{{ item.title }} anheften" title="Anheften">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M12 17v5"/>
                <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
            </svg>
        </button>
        <button type="button" class="ws-item-button ws-item-popout" aria-label="{{ item.title }} in neuem Fenster öffnen" title="In neuem Fenster öffnen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
        </button>
    </div>
</article>
{% endmacro %}
