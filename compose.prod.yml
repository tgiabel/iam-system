name: sofa

services:
  app:
    image: sofa:${RELEASE:?set RELEASE to a main commit SHA}
    env_file:
      - /var/www/sofa-secrets/agent-stats.env
    environment:
      APP_ENV: production
      SD_API_BASE_URL: http://sd-api:8080
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - backend

networks:
  backend:
    external: true
    name: sd-api-backend
